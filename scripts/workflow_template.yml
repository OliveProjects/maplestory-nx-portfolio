# The hourly price job for your MapleStory portfolio page (added by
# website_creator.py). It runs .portfolio/actions_job.py every hour and
# commits the new prices, which GitHub Pages then publishes.
#
# The API key is the repo secret MAPLESTORY_MARKET_KEY (Settings → Secrets
# and variables → Actions). The fetched price history is kept in your private
# data repo (this repo's name + "-data"), which the job checks out with the
# deploy key in the secret DATA_DEPLOY_KEY and pushes to after each run.
# Without that secret it stays in the Actions cache, which GitHub can empty.
# It is never committed here (maplestory.market's terms: no republishing).
name: Prices

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DATA_REPO: ${{ secrets.DATA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet Pillow

      # Also with a data repo: the first time, what the cache holds is moved there.
      - name: Restore the fetched history from the cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .portfolio/history
            .portfolio/owners
            .portfolio/daily
            .portfolio/hours.json
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Check out your private data repo
        if: env.HAS_DATA_REPO == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: .portfolio/store

      - name: Use the data repo for the history
        if: env.HAS_DATA_REPO == 'true'
        run: |
          cd .portfolio
          mkdir -p store/history store/owners store/daily
          for d in history owners daily; do
            if [ -d "$d" ] && [ ! -L "$d" ]; then
              rsync -a --ignore-existing "$d"/ "store/$d"/
              rm -rf "$d"
            fi
            ln -sfn "store/$d" "$d"
          done
          if [ -f hours.json ] && [ ! -L hours.json ] && [ ! -f store/hours.json ]; then mv hours.json store/hours.json; fi
          rm -f hours.json
          ln -s store/hours.json hours.json

      - name: Fetch and build prices
        env:
          MSM_KEY: ${{ secrets.MAPLESTORY_MARKET_KEY }}
        run: |
          if [ -z "$MSM_KEY" ]; then echo "The secret MAPLESTORY_MARKET_KEY is missing."; exit 1; fi
          printf '%s' "$MSM_KEY" > .portfolio/api_key.txt
          python .portfolio/actions_job.py
          rm -f .portfolio/api_key.txt

      - name: Save the history to your data repo
        if: always() && env.HAS_DATA_REPO == 'true'
        run: |
          rm -f .portfolio/api_key.txt
          cd .portfolio/store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new history."; exit 0; fi
          git commit -q -m "Price history"
          git push -q

      - name: Save the history to the cache
        if: always() && env.HAS_DATA_REPO != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .portfolio/history
            .portfolio/owners
            .portfolio/daily
            .portfolio/hours.json
          key: history-${{ github.run_id }}

      - name: Commit the new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A maplestory
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "MapleStory prices"
          git pull -q --rebase
          git push -q
